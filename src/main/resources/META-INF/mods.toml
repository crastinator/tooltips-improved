license = "MIT"
issueTrackerURL = "https://github.com/crastinator/tooltips-improved/issues"

modLoader="javafml"
loaderVersion="[${forge},)"
clientSideOnly=true

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "${authors}"
description = "Makes tooltips readable and more useful: wraps, repositions and scrolls long tooltips, folds armor trims, and adds exact durability, equipment comparison, and previews of books, maps, banners and fireworks."

logoFile = "assets/tooltipsimproved/icon.png"
displayTest = "IGNORE_ALL_VERSION"
displayURL = "https://modrinth.com/project/tooltips-improved"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
